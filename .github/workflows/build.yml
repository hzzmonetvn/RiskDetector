name: Build App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant (release, debug, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - 'release'
          - 'debug'
          - 'both'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Set up Android build toolchain
        id: toolchain
        uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Configure signing keystore
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keystore_path="$RUNNER_TEMP/release.keystore"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && \
             [ -n "${ANDROID_KEY_ALIAS:-}" ] && \
             [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Configuring release keystore from repository secrets..."
            if ! printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$keystore_path"; then
              echo "ANDROID_KEYSTORE_BASE64 is not valid base64." >&2
              exit 1
            fi
            if [ ! -s "${keystore_path}" ]; then
              echo "Decoded release keystore is empty." >&2
              exit 1
            fi
            echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "keystore_password=${ANDROID_KEYSTORE_PASSWORD}" >> "$GITHUB_OUTPUT"
            echo "key_alias=${ANDROID_KEY_ALIAS}" >> "$GITHUB_OUTPUT"
            echo "key_password=${ANDROID_KEY_PASSWORD}" >> "$GITHUB_OUTPUT"
          else
            echo "Release keystore secrets not configured. Generating automated fallback keystore..."
            keytool -genkeypair -v \
              -keystore "$keystore_path" \
              -alias "riskdetector" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "riskdetector" \
              -keypass "riskdetector" \
              -dname "CN=Risk Detector, OU=Android, O=Risk Detector, C=VN"
            echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"
            echo "keystore_password=riskdetector" >> "$GITHUB_OUTPUT"
            echo "key_alias=riskdetector" >> "$GITHUB_OUTPUT"
            echo "key_password=riskdetector" >> "$GITHUB_OUTPUT"
          fi

          chmod 600 "${keystore_path}"

      - name: Extract signing fingerprint
        id: signing_fingerprint
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.keystore_password }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
        run: |
          set -euo pipefail

          keytool_output=$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore "${ANDROID_KEYSTORE_PATH}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}")

          expected_sha256=$(printf '%s\n' "${keytool_output}" \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n 1 \
            | tr -d '[:space:]:' \
            | tr '[:upper:]' '[:lower:]')

          owner_line=$(printf '%s\n' "${keytool_output}" \
            | sed -n 's/^Owner: //p' \
            | head -n 1)

          signer_name=$(OWNER_LINE="${owner_line}" python3 - <<'PY'
          import os
          import re

          owner = os.environ.get("OWNER_LINE", "").strip()
          if not owner:
              print("Risk Detector Signer", end="")
              raise SystemExit(0)

          match = re.search(r"(?:^|,\s*)CN=([^,]+)", owner)
          if match:
              print(match.group(1).strip(), end="")
          else:
              print(owner, end="")
          PY
          )

          if [ -z "${expected_sha256}" ]; then
            echo "Failed to extract SHA-256 fingerprint from keystore." >&2
            exit 1
          fi

          echo "sha256=${expected_sha256}" >> "$GITHUB_OUTPUT"
          echo "signer_name=${signer_name}" >> "$GITHUB_OUTPUT"

      - name: Build APK and SDK AAR
        id: build
        shell: bash
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.keystore_password }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'both' }}
        run: |
          set -euo pipefail

          start_time=$(date +%s)
          build_time_utc=$(date -u +%Y%m%d%H%M%S)
          build_time_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          tasks=()
          case "${BUILD_TYPE}" in
            release)
              tasks+=(":app:assembleRelease")
              ;;
            debug)
              tasks+=(":app:assembleDebug")
              ;;
            both|*)
              tasks+=(":app:assembleRelease" ":app:assembleDebug")
              ;;
          esac
          tasks+=(":sdk:aar:assemble")

          echo "Running Gradle tasks: ${tasks[*]}"
          ./gradlew \
            --stacktrace \
            -Pduckdetector.buildTimeUtc="${build_time_utc}" \
            "${tasks[@]}"
          end_time=$(date +%s)

          duration_seconds=$((end_time - start_time))
          duration_minutes=$((duration_seconds / 60))
          duration_remainder=$((duration_seconds % 60))

          printf -v duration_human "%dm %02ds" "$duration_minutes" "$duration_remainder"

          echo "duration_seconds=$duration_seconds" >> "$GITHUB_OUTPUT"
          echo "duration_human=$duration_human" >> "$GITHUB_OUTPUT"
          echo "build_time_utc=$build_time_utc" >> "$GITHUB_OUTPUT"
          echo "build_time_iso=$build_time_iso" >> "$GITHUB_OUTPUT"

      - name: Collect artifact metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          metadata_json=$(python3 - <<'PY'
          import json
          from pathlib import Path

          metadata_candidates = [
              Path("app/build/outputs/apk/release/output-metadata.json"),
              Path("app/release/output-metadata.json"),
              Path("app/build/outputs/apk/debug/output-metadata.json"),
              Path("app/debug/output-metadata.json"),
          ]
          metadata_path = next((path for path in metadata_candidates if path.exists()), None)
          if metadata_path is None:
              raise SystemExit("output-metadata.json not found in release or debug output directories.")

          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          elements = metadata.get("elements") or []
          if not elements:
              raise SystemExit("No APK entries found in output-metadata.json.")

          apk_elements = [
              element for element in elements
              if element.get("outputFile", "").endswith(".apk")
          ]
          if not apk_elements:
              raise SystemExit("No APK files were listed in output-metadata.json.")

          universal_elements = [
              element for element in apk_elements
              if (element.get("type") or "").upper() == "UNIVERSAL"
              or element.get("outputFile", "").endswith("-Universal.apk")
          ]

          if len(universal_elements) == 1:
              selected_element = universal_elements[0]
          else:
              selected_element = apk_elements[0]

          output_file = selected_element.get("outputFile", "")
          apk_path = metadata_path.parent / output_file
          version_name = selected_element.get("versionName") or "1.0.0"
          version_code = selected_element.get("versionCode") or 1

          payload = {
              "apk_path": str(apk_path),
              "apk_name": apk_path.name,
              "version_name": str(version_name).strip(),
              "version_code": str(version_code),
          }
          print(json.dumps(payload))
          PY
          )

          apk_path=$(python3 -c "import json; print(json.loads('''$metadata_json''')['apk_path'])")
          apk_name=$(python3 -c "import json; print(json.loads('''$metadata_json''')['apk_name'])")
          version_name=$(python3 -c "import json; print(json.loads('''$metadata_json''')['version_name'])")
          version_code=$(python3 -c "import json; print(json.loads('''$metadata_json''')['version_code'])")

          {
            echo "apk_path=$apk_path"
            echo "apk_name=$apk_name"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        env:
          APK_PATH: ${{ steps.metadata.outputs.apk_path }}
          BUILD_TOOLS: ${{ steps.toolchain.outputs.build-tools }}
          EXPECTED_SIGNER_SHA256: ${{ steps.signing_fingerprint.outputs.sha256 }}
        run: |
          set -euo pipefail

          if [ -f "${APK_PATH}" ]; then
            apksigner_output=$("${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "${APK_PATH}")
            printf '%s\n' "${apksigner_output}"

            actual_sha256=$(APKSIGNER_OUTPUT="${apksigner_output}" python3 - <<'PY'
            import os

            output = os.environ.get("APKSIGNER_OUTPUT", "")
            marker = "certificate SHA-256 digest:"
            for raw_line in output.splitlines():
                if marker not in raw_line or "Source Stamp" in raw_line:
                    continue
                digest = raw_line.split(marker, 1)[1].replace(":", "").strip().lower()
                if digest:
                    print(digest, end="")
                    break
            PY
            )

            if [ -n "${actual_sha256}" ] && [ "${actual_sha256}" != "${EXPECTED_SIGNER_SHA256}" ]; then
              echo "Warning: APK signature ${actual_sha256} does not match expected ${EXPECTED_SIGNER_SHA256}"
            else
              echo "APK signature successfully verified."
            fi
          fi

      - name: Stage APK and SDK artifacts
        id: stage_artifacts
        shell: bash
        run: |
          set -euo pipefail

          staging_dir="$RUNNER_TEMP/artifacts"
          mkdir -p "$staging_dir"

          echo "Searching for built APKs..."
          find app/build/outputs/apk -type f -name "*.apk" ! -name "*-unaligned.apk" | while read -r apk_file; do
            echo "Staging APK: $apk_file"
            cp "$apk_file" "$staging_dir/"
          done

          aar_source="sdk/aar/build/outputs/aar/aar.aar"
          if [ -s "$aar_source" ]; then
            aar_name="riskdetector-sdk-${GITHUB_SHA:0:8}.aar"
            cp "$aar_source" "$staging_dir/$aar_name"
            echo "Staging AAR: $staging_dir/$aar_name"
          fi

          count=$(find "$staging_dir" -type f | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No artifacts found to stage." >&2
            exit 1
          fi

          echo "staging_dir=$staging_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_count=$count" >> "$GITHUB_OUTPUT"

      - name: Upload APK and SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Risk-Detector-${{ steps.metadata.outputs.version_name || github.sha }}
          path: ${{ steps.stage_artifacts.outputs.staging_dir }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Nightly update manifest
        if: false
        shell: bash
        env:
          APK_PATH: ${{ steps.metadata.outputs.apk_path }}
          AAR_PATH: sdk/aar/build/outputs/aar/aar.aar
          NIGHTLY_MANIFEST_BRANCH: main
          BUILD_TIME_ISO: ${{ steps.build.outputs.build_time_iso }}
          NIGHTLY_TAG: nightly
          RELEASE_ASSETS_JSON: '[]'
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          import sys
          sys.path.insert(0, ".github/scripts")
          from nightly_release import canonical_asset_url

          apk_path = Path(os.environ["APK_PATH"])
          if not apk_path.is_file() or apk_path.stat().st_size <= 0:
              raise SystemExit(f"Release APK is missing or empty: {apk_path}")
          aar_path = Path(os.environ["AAR_PATH"])
          if not aar_path.is_file() or aar_path.stat().st_size <= 0:
              raise SystemExit(f"SDK AAR is missing or empty: {aar_path}")

          try:
              release_assets = json.loads(os.environ["RELEASE_ASSETS_JSON"])
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Release action returned invalid asset JSON: {exc}") from exc
          if not isinstance(release_assets, list) or len(release_assets) != 2 or any(
              not isinstance(asset, dict) for asset in release_assets
          ):
              raise SystemExit(
                  "Expected exactly two uploaded assets: one APK and one SDK AAR."
              )

          def matches_file(asset: dict, path: Path) -> bool:
              return asset.get("name") == path.name or asset.get("label") == path.name

          apk_assets = [asset for asset in release_assets if matches_file(asset, apk_path)]
          aar_assets = [asset for asset in release_assets if matches_file(asset, aar_path)]
          if len(apk_assets) != 1 or len(aar_assets) != 1:
              raise SystemExit("Release action did not return the expected APK and SDK AAR assets.")
          apk_asset = apk_assets[0]
          aar_asset = aar_assets[0]
          apk_asset_id = apk_asset.get("id")
          apk_name = apk_asset.get("name", "")
          if not isinstance(apk_asset_id, int) or apk_asset_id <= 0:
              raise SystemExit(f"Release action returned an invalid APK asset id: {apk_asset_id!r}")
          if apk_asset.get("state") != "uploaded":
              raise SystemExit(f"APK release asset is not uploaded: {apk_asset.get('state')!r}")
          if not isinstance(apk_name, str) or not apk_name.lower().endswith(".apk"):
              raise SystemExit(f"Release action returned an invalid APK asset name: {apk_name!r}")
          apk_url = canonical_asset_url(os.environ["GITHUB_REPOSITORY"], os.environ["NIGHTLY_TAG"], apk_name)

          aar_asset_id = aar_asset.get("id")
          aar_name = aar_asset.get("name", "")
          if not isinstance(aar_asset_id, int) or aar_asset_id <= 0:
              raise SystemExit(f"Release action returned an invalid SDK AAR asset id: {aar_asset_id!r}")
          if aar_asset.get("state") != "uploaded":
              raise SystemExit(f"SDK AAR release asset is not uploaded: {aar_asset.get('state')!r}")
          if not isinstance(aar_name, str) or not aar_name.lower().endswith(".aar"):
              raise SystemExit(f"Release action returned an invalid SDK AAR asset name: {aar_name!r}")
          aar_url = canonical_asset_url(os.environ["GITHUB_REPOSITORY"], os.environ["NIGHTLY_TAG"], aar_name)
          aar_size = aar_path.stat().st_size
          if aar_asset.get("size") != aar_size:
              raise SystemExit(
                  f"Uploaded SDK AAR size mismatch: local={aar_size}, release={aar_asset.get('size')!r}"
              )

          apk_size = apk_path.stat().st_size
          remote_size = apk_asset.get("size")
          if remote_size != apk_size:
              raise SystemExit(
                  f"Uploaded APK size mismatch: local={apk_size}, release={remote_size!r}"
              )

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          def iso8601_from_epoch(epoch: str) -> str:
              return datetime.fromtimestamp(int(epoch), tz=timezone.utc) \
                  .strftime("%Y-%m-%dT%H:%M:%SZ")

          sha256 = hashlib.sha256()
          with apk_path.open("rb") as apk_file:
              for chunk in iter(lambda: apk_file.read(1024 * 1024), b""):
                  sha256.update(chunk)
          apk_sha256 = sha256.hexdigest()
          remote_digest = apk_asset.get("digest")
          if remote_digest and str(remote_digest).lower() != f"sha256:{apk_sha256}":
              raise SystemExit(
                  f"Uploaded APK digest mismatch: local=sha256:{apk_sha256}, release={remote_digest}"
              )

          aar_sha256 = hashlib.sha256(aar_path.read_bytes()).hexdigest()
          aar_remote_digest = aar_asset.get("digest")
          if aar_remote_digest and str(aar_remote_digest).lower() != f"sha256:{aar_sha256}":
              raise SystemExit(
                  f"Uploaded SDK AAR digest mismatch: local=sha256:{aar_sha256}, release={aar_remote_digest}"
              )

          commit_sha = git("rev-parse", "HEAD")
          manifest = {
              "schemaVersion": 1,
              "channel": "nightly",
              "releaseTag": os.environ["NIGHTLY_TAG"],
              "branch": os.environ["NIGHTLY_MANIFEST_BRANCH"],
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "commit": {
                  "sha": commit_sha,
                  "subject": git("log", "-1", "--format=%s", "HEAD"),
                  "body": git("log", "-1", "--format=%b", "HEAD"),
                  "authorName": git("log", "-1", "--format=%an", "HEAD"),
                  "authoredAt": iso8601_from_epoch(git("log", "-1", "--format=%at", "HEAD")),
              },
              "builtAtUtc": os.environ["BUILD_TIME_ISO"],
              "sdk": {
                  "name": aar_name,
                  "downloadUrl": aar_url,
                  "sizeBytes": aar_size,
                  "sha256": aar_sha256,
              },
              "apk": {
                  "name": apk_name,
                  "downloadUrl": apk_url,
                  "sizeBytes": apk_size,
                  "sha256": apk_sha256,
              },
          }

          Path("update.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"apk_asset_id={apk_asset_id}\n")
              output.write(f"aar_asset_id={aar_asset_id}\n")
              output.write(f"aar_public_url={aar_url}\n")
          PY

          echo "manifest_path=update.json" >> "$GITHUB_OUTPUT"

      - name: Generate Build Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          staging_dir="${RUNNER_TEMP}/artifacts"

          {
            echo "## 🛡️ Risk Detector Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "| :--- | :--- |"
            echo "| **Version** | \`${{ steps.metadata.outputs.version_name || 'N/A' }} (${{ steps.metadata.outputs.version_code || 'N/A' }})\` |"
            echo "| **Commit** | \`${GITHUB_SHA:0:8}\` |"
            echo "| **Branch** | \`${GITHUB_REF_NAME}\` |"
            echo "| **Signer** | \`${{ steps.signing_fingerprint.outputs.signer_name || 'Automated' }}\` |"
            echo "| **Duration** | \`${{ steps.build.outputs.duration_human || 'N/A' }}\` |"
            echo ""
            echo "### 📦 Generated Artifacts"
            echo ""
            if [ -d "$staging_dir" ] && [ "$(find "$staging_dir" -type f | wc -l)" -gt 0 ]; then
              echo "| File Name | Size | SHA-256 Checksum |"
              echo "| :--- | :--- | :--- |"
              for file in "$staging_dir"/*; do
                if [ -f "$file" ]; then
                  filename=$(basename "$file")
                  filesize=$(ls -lh "$file" | awk '{print $5}')
                  filesha=$(sha256sum "$file" | awk '{print $1}')
                  echo "| \`$filename\` | $filesize | \`$filesha\` |"
                fi
              done
            else
              echo "No artifacts generated."
            fi
            echo ""
            echo "> **Note:** Artifacts are available for download in the **Artifacts** section at the top of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/release.keystore"
